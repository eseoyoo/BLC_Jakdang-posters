<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BLC 작당 모임 포스터</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #0d0d0d;
      color: #f0f0f0;
      font-family: 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif;
      min-height: 100vh;
    }

    header {
      text-align: center;
      padding: 60px 20px 40px;
    }

    header h1 {
      font-size: 2rem;
      font-weight: 700;
      letter-spacing: 0.1em;
      color: #ffffff;
    }

    header p {
      margin-top: 10px;
      font-size: 0.95rem;
      color: #888;
      letter-spacing: 0.05em;
    }

    .update-badge {
      display: inline-block;
      margin-top: 16px;
      padding: 5px 14px;
      background: #1e1e1e;
      border: 1px solid #333;
      border-radius: 20px;
      font-size: 0.8rem;
      color: #aaa;
      letter-spacing: 0.04em;
    }

    .update-badge span {
      color: #e0c97f;
      font-weight: 600;
    }

    .gallery {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 24px;
      padding: 20px 40px 80px;
      max-width: 1200px;
      margin: 0 auto;
    }

    .card {
      background: #1a1a1a;
      border-radius: 12px;
      overflow: hidden;
      transition: transform 0.25s ease, box-shadow 0.25s ease;
      cursor: pointer;
    }

    .card:hover {
      transform: translateY(-6px);
      box-shadow: 0 16px 40px rgba(0,0,0,0.5);
    }

    .card img {
      width: 100%;
      height: 380px;
      object-fit: cover;
      display: block;
    }

    .card-label {
      padding: 14px 18px;
      font-size: 0.95rem;
      font-weight: 600;
      color: #ddd;
      letter-spacing: 0.03em;
    }

    /* Lightbox */
    .lightbox {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.92);
      z-index: 999;
      justify-content: center;
      align-items: center;
    }

    .lightbox.active {
      display: flex;
    }

    .lightbox img {
      max-width: 90vw;
      max-height: 90vh;
      object-fit: contain;
      border-radius: 8px;
    }

    .lightbox-close {
      position: fixed;
      top: 20px;
      right: 28px;
      font-size: 2rem;
      color: #fff;
      cursor: pointer;
      opacity: 0.7;
      transition: opacity 0.2s;
    }

    .lightbox-close:hover { opacity: 1; }

    footer {
      text-align: center;
      padding: 30px;
      color: #444;
      font-size: 0.8rem;
    }
  </style>
</head>
<body>

<header>
  <h1>BLC 작당 모임</h1>
  <p>클릭하면 크게 볼 수 있어요</p>
  <div class="update-badge">최종 업데이트 <span>2026. 5. 17</span></div>
</header>

<div class="gallery">
  <div class="card" onclick="openLightbox(this)">
    <img src="마셔.jpg" alt="마셔">
    <div class="card-label">마셔</div>
  </div>
  <div class="card" onclick="openLightbox(this)">
    <img src="밖이당.jpg" alt="밖이당">
    <div class="card-label">밖이당</div>
  </div>
  <div class="card" onclick="openLightbox(this)">
    <img src="안벌당_BLC작당_02.jpg" alt="안벌당">
    <div class="card-label">안벌당</div>
  </div>
  <div class="card" onclick="openLightbox(this)">
    <img src="책편당.png" alt="책편당">
    <div class="card-label">책편당</div>
  </div>
  <div class="card" onclick="openLightbox(this)">
    <img src="초코당.png" alt="초코당">
    <div class="card-label">초코당</div>
  </div>
  <div class="card" onclick="openLightbox(this)">
    <img src="황부장.png" alt="황부장">
    <div class="card-label">황부장</div>
  </div>
</div>

<div class="lightbox" id="lightbox" onclick="closeLightbox()">
  <span class="lightbox-close" onclick="closeLightbox()">✕</span>
  <img id="lightbox-img" src="" alt="">
</div>

<footer>BLC 작당 모임 © 2026</footer>

<script>
  function openLightbox(card) {
    const img = card.querySelector('img');
    document.getElementById('lightbox-img').src = img.src;
    document.getElementById('lightbox').classList.add('active');
  }
  function closeLightbox() {
    document.getElementById('lightbox').classList.remove('active');
  }
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape') closeLightbox();
  });
</script>

</body>
</html>
